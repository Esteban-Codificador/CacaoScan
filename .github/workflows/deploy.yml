#
# FASES RELEASE y DEPLOY del ciclo DevOps.
#
# Se dispara al publicar una etiqueta de version (v0.2.0, v1.0.0...). Hace tres
# cosas, en este orden:
#
#   RELEASE  1. Compila y FIRMA el APK, derivando la version de la etiqueta.
#            2. Crea una GitHub Release con el APK adjunto.
#   DEPLOY   3. Lo distribuye a los testers con Firebase App Distribution.
#
# IMPORTANTE SOBRE RNF06 (cero transmision de datos del usuario):
# este despliegue NO introduce ninguna conexion de red dentro de la aplicacion.
# La subida ocurre aqui, en el servidor de integracion continua, y la descarga
# ocurre en el navegador del tester ANTES de instalar. La aplicacion no lleva el
# SDK de Firebase ni google-services.json, y su manifiesto sigue sin declarar
# android.permission.INTERNET.
#
name: Release y despliegue

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # necesario para crear la GitHub Release

jobs:
  deploy:
    name: Firmar, publicar y distribuir
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle con cache
        uses: gradle/actions/setup-gradle@v4

      # La version del APK se deriva de la etiqueta de git. Asi es imposible que
      # la version publicada y la del repositorio se separen.
      - name: Calcular la version desde la etiqueta
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Publicando version $VERSION (versionCode ${GITHUB_RUN_NUMBER})"

      # El keystore se guarda como secreto en base64 y se reconstruye aqui.
      # Nunca existe en el repositorio.
      - name: Restaurar el keystore de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/cacaoscan.jks"

      - name: Compilar y firmar el APK (FASE RELEASE)
        env:
          KEYSTORE_FILE: cacaoscan.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}

      - name: Verificar que el APK quedo firmado
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "No se genero un APK firmado"; exit 1; }
          echo "APK firmado: $(du -h "$APK" | cut -f1)"

      - name: Crear la GitHub Release con el APK adjunto
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

      # FASE DEPLOY.
      # Se usa la CLI oficial de Firebase y no una accion de terceros de la
      # comunidad: reduce la dependencia de un proyecto que podria quedar sin
      # mantenimiento, y deja la migracion a otra plataforma como un cambio de
      # un solo paso. Visual Studio App Center, que era el estandar del sector
      # para esto, fue retirado el 31 de marzo de 2025.
      - name: Preparar credenciales de Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$HOME/firebase-service-account.json"

      - name: Distribuir a los testers (FASE DEPLOY)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.HOME }}/firebase-service-account.json
        run: |
          npm install -g firebase-tools
          firebase appdistribution:distribute \
            app/build/outputs/apk/release/app-release.apk \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --groups "testers" \
            --release-notes "CacaoScan ${{ steps.version.outputs.name }}"

      - name: Borrar credenciales del runner
        if: always()
        run: rm -f "$HOME/firebase-service-account.json" "$GITHUB_WORKSPACE/cacaoscan.jks"
