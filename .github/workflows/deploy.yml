#
# FASES RELEASE y DEPLOY del ciclo DevOps.
#
# Se dispara al publicar una etiqueta de version (v1.1.0, v1.2.0...):
#
#   RELEASE  1. Compila el APK, derivando la version de la etiqueta.
#            2. Crea una GitHub Release con el APK adjunto y las notas de
#               cambios generadas a partir de los commits.
#   DEPLOY   3. Lo distribuye a los testers con Firebase App Distribution.
#
# DEGRADACION CONTROLADA. Cada paso que necesita un secreto comprueba antes si
# existe, en lugar de fallar:
#   - Sin keystore      -> se publica el APK de depuracion (firmado con la
#                          clave de depuracion), marcado como pre-release.
#   - Sin Firebase      -> la Release se crea igual y el Deploy se omite.
# Asi la etapa Release se puede demostrar desde el primer dia, y cargar los
# secretos solo mejora el resultado.
#
# Sobre la red: la subida a Firebase ocurre aqui, en el servidor de integracion
# continua. La aplicacion no lleva el SDK de Firebase ni google-services.json.
# El permiso INTERNET de la app lo usa solo su modulo de Administracion para
# hablar con los microservicios (ver docs/12-microservicios-en-la-app.md).
#
name: Release y despliegue

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # necesario para crear la GitHub Release

jobs:
  release:
    name: Publicar y distribuir
    runs-on: ubuntu-latest

    # Los secretos no se pueden consultar en un "if" directamente; se convierten
    # aqui en indicadores de "existe / no existe" sin exponer su valor.
    env:
      TIENE_FIRMA: ${{ secrets.KEYSTORE_BASE64 != '' }}
      TIENE_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.FIREBASE_APP_ID != '' }}

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle con cache
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso de ejecucion al wrapper de Gradle
        run: chmod +x gradlew

      # La version del APK se deriva de la etiqueta de git. Asi es imposible que
      # la version publicada y la del repositorio se separen.
      - name: Calcular la version desde la etiqueta
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Publicando version $VERSION (versionCode ${GITHUB_RUN_NUMBER})"

      - name: Ejecutar las pruebas antes de publicar
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # ---------------------------------------------------------- con firma
      - name: Restaurar el keystore de firma
        if: env.TIENE_FIRMA == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/cacaoscan.jks"

      - name: Compilar y firmar el APK de release (FASE RELEASE)
        if: env.TIENE_FIRMA == 'true'
        env:
          KEYSTORE_FILE: cacaoscan.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}
          cp app/build/outputs/apk/release/app-release.apk \
             "CacaoScan-${{ steps.version.outputs.name }}.apk"

      # ---------------------------------------------------------- sin firma
      - name: Compilar el APK de depuracion (sin keystore cargado)
        if: env.TIENE_FIRMA != 'true'
        run: |
          echo "::warning::No hay KEYSTORE_BASE64: se publica el APK de depuracion como pre-release."
          ./gradlew :app:assembleDebug --no-daemon \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}
          cp app/build/outputs/apk/debug/app-debug.apk \
             "CacaoScan-${{ steps.version.outputs.name }}-debug.apk"

      - name: Crear la GitHub Release con el APK adjunto
        uses: softprops/action-gh-release@v2
        with:
          name: CacaoScan ${{ steps.version.outputs.name }}
          files: CacaoScan-*.apk
          generate_release_notes: true
          prerelease: ${{ env.TIENE_FIRMA != 'true' }}
          body: |
            Version ${{ steps.version.outputs.name }} de CacaoScan, generada por GitHub Actions
            a partir de la etiqueta `${{ github.ref_name }}`.

            - Las pruebas unitarias pasaron antes de publicar.
            - El APK adjunto se instala en Android 8.0 o superior.

      # ------------------------------------------------------------ DEPLOY
      # Se usa la CLI oficial de Firebase y no una accion de la comunidad:
      # reduce la dependencia de un proyecto que podria quedar sin
      # mantenimiento. Visual Studio App Center, que era el estandar del sector
      # para esto, fue retirado el 31 de marzo de 2025.
      - name: Preparar credenciales de Firebase
        if: env.TIENE_FIREBASE == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$HOME/firebase-service-account.json"

      - name: Distribuir a los testers (FASE DEPLOY)
        if: env.TIENE_FIREBASE == 'true'
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/firebase-service-account.json"
          npm install -g firebase-tools
          firebase appdistribution:distribute CacaoScan-*.apk \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --groups "testers" \
            --release-notes "CacaoScan ${{ steps.version.outputs.name }}"

      - name: Aviso si se omitio el Deploy
        if: env.TIENE_FIREBASE != 'true'
        run: echo "::notice::Sin credenciales de Firebase. La Release se creo, pero no se distribuyo a testers."

      - name: Borrar credenciales del runner
        if: always()
        run: rm -f "$HOME/firebase-service-account.json" "$GITHUB_WORKSPACE/cacaoscan.jks"
