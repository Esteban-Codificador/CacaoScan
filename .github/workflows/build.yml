#
# FASES BUILD y TEST del ciclo DevOps.
#
# Se ejecuta en cada push y en cada pull request. Su proposito es que ningun
# cambio llegue a la rama principal sin haber compilado y pasado las pruebas en
# una maquina limpia, independiente del equipo de cada integrante.
#
name: Build y pruebas

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Si se empuja dos veces seguidas, se cancela la ejecucion anterior: no tiene
# sentido gastar minutos validando un commit que ya quedo obsoleto.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar, probar y analizar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Verifica que el gradle-wrapper.jar del repositorio es un binario oficial
      # y no uno manipulado. Es una comprobacion de cadena de suministro.
      - name: Validar el wrapper de Gradle
        uses: gradle/actions/wrapper-validation@v4

      - name: Preparar Gradle con cache
        uses: gradle/actions/setup-gradle@v4

      # El repositorio se creo desde Windows, que no guarda el permiso de
      # ejecucion. Sin esto el runner de Linux responde "exit code 126"
      # (permiso denegado) al intentar ejecutar ./gradlew.
      - name: Dar permiso de ejecucion al wrapper de Gradle
        run: chmod +x gradlew

      - name: Compilar la aplicacion (FASE BUILD)
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Ejecutar pruebas unitarias (FASE TEST)
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Analisis estatico con Android Lint (FASE CODE)
        run: ./gradlew :app:lintDebug --no-daemon

      # Los informes se publican aunque las pruebas fallen: es justo cuando mas
      # falta hacen.
      - name: Publicar informes de pruebas y lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Publicar el APK de depuracion
        uses: actions/upload-artifact@v4
        with:
          name: cacaoscan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
